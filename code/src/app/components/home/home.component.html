<div class="home-root">

  <!-- ===== HERO ===== -->
  <section class="hero-section">
    <div class="hero-eyebrow">Data Visualization Tool</div>

    <div class="hero-grid">
      <!-- Left: brand + CTAs -->
      <div class="hero-text">
        <h1 class="hero-brand">
          <em class="brand-word-chart">Chart</em><span class="brand-word-genious">Genious</span>
        </h1>
        <p class="hero-desc">
          Turn raw spreadsheets into visual intelligence. Upload your data,
          configure your charts, and uncover insights — all in a single workspace.
        </p>
        <div class="cta-row">
          <div class="file-input-wrapper">
            <label for="fileInput" class="btn-primary">Upload Spreadsheet</label>
            <input
              type="file"
              id="fileInput"
              class="hidden-input"
              (change)="onFileChange($event)"
              accept=".xlsx, .xls, .csv"
            />
          </div>
          <button class="btn-ghost" (click)="loadSampleFile()">Try sample data &rarr;</button>
        </div>
        <p class="cta-hint">Accepts .xlsx &middot; .xls &middot; .csv</p>
      </div>

      <!-- Right: image -->
      <div class="hero-visual">
        <div class="hero-image-frame">
          <img src="assets/home.png" alt="{{ APP_TITLE }} preview" class="hero-image" />
        </div>
        <div class="hero-accent-line"></div>
      </div>
    </div>
  </section>

  <!-- ===== FEATURE STRIP ===== -->
  <section class="feature-strip">
    <div class="feature-item">
      <span class="feature-value">6</span>
      <span class="feature-label">Chart Types</span>
    </div>
    <div class="feature-sep"></div>
    <div class="feature-item">
      <span class="feature-value">CSV &amp; Excel</span>
      <span class="feature-label">Input Formats</span>
    </div>
    <div class="feature-sep"></div>
    <div class="feature-item">
      <span class="feature-value">Zero</span>
      <span class="feature-label">Setup Required</span>
    </div>
    <div class="feature-sep"></div>
    <div class="feature-item">
      <span class="feature-value">Print</span>
      <span class="feature-label">Export Ready</span>
    </div>
  </section>

</div>
